<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Interactive periodic table - Periodic Table" />
    <meta property="og:title" content="Periodic Table" />
    <meta property="og:description" content="Interactive periodic table - Periodic Table" />
    <meta property="og:image" content="./assets/tried.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Periodic Table" />
    <meta name="twitter:description" content="Interactive periodic table - Periodic Table" />
    <meta name="twitter:image" content="./assets/tried.png" />
    <title>Periodic Table</title>
    <link rel="stylesheet" href="./assets/app.css" />
    <link rel="icon" type="image/png" href="./assets/tried.png" />
  </head>
  <body>
    <header class="topbar">
      <h1 class="title"><img src="./assets/tried.png" alt="Periodic Table 로고" style="height: 24px; vertical-align: middle; margin-right: 8px;" />Periodic Table</h1>
      <div class="controls">
        <label class="sr-only" for="search">검색</label>
        <input id="search" type="search" placeholder="번호 · 심볼 · 이름 검색" aria-label="원소 검색" />
        
        <label class="sr-only" for="filter-category">카테고리</label>
        <select id="filter-category" aria-label="카테고리 필터"></select>
        
        <label class="sr-only" for="filter-phase">상온 상태</label>
        <select id="filter-phase" aria-label="상온 상태 필터">
          <option value="">All phases</option>
          <option value="solid">Solid</option>
          <option value="liquid">Liquid</option>
          <option value="gas">Gas</option>
        </select>
        
        <label class="sr-only" for="filter-block">블록</label>
        <select id="filter-block" aria-label="블록 필터">
          <option value="">All blocks</option>
          <option value="s">s</option>
          <option value="p">p</option>
          <option value="d">d</option>
          <option value="f">f</option>
        </select>
        
        <label class="sr-only" for="heatmap">히트맵 속성</label>
        <select id="heatmap" aria-label="히트맵 속성">
          <option value="">Heatmap: off</option>
          <option value="atomic_mass">Atomic mass</option>
          <option value="electronegativity_pauling">Electronegativity</option>
          <option value="melt">Melting point</option>
          <option value="boil">Boiling point</option>
          <option value="density">Density</option>
        </select>
        <button id="btn-random" type="button" class="chip" aria-label="랜덤 원소 상세 열기">랜덤</button>
        <button id="btn-fun" type="button" class="chip" aria-pressed="false" aria-label="Fun 모드 토글">재미</button>

        <!-- Removed legacy language select -->
        <label class="sr-only" for="lang">언어</label>
        <select id="lang" aria-label="언어">
          <option value="ko">한국어</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="topbar-right">
        <div id="themeControl" class="segmented" role="radiogroup" aria-label="테마">
          <button type="button" class="seg-btn" role="radio" aria-checked="false" data-theme="light" aria-label="라이트"><span class="icon">☀️</span></button>
          <button type="button" class="seg-btn" role="radio" aria-checked="false" data-theme="dark" aria-label="다크"><span class="icon">🌗</span></button>
          <button type="button" class="seg-btn" role="radio" aria-checked="false" data-theme="high-contrast" aria-label="고대비"><span class="icon">⬛️⬜️</span></button>
        </div>
        <!-- Language segmented control -->
        <div id="langControl" class="segmented" role="radiogroup" aria-label="언어">
          <button type="button" class="seg-btn" role="radio" aria-checked="false" data-lang="ko" aria-label="한국어"><span class="icon">🇰🇷</span></button>
          <button type="button" class="seg-btn" role="radio" aria-checked="false" data-lang="en" aria-label="English"><span class="icon">🇺🇸</span></button>
        </div>
        <span id="themeBadge" class="badge" aria-label="현재 테마"><span class="icon">🎨</span></span>
      </div>
      <div id="minibar" class="minibar" aria-label="상태 요약"></div>
    </header>

    <section class="legend" aria-label="범례"></section>

    <main class="grid-wrap" aria-label="주기율표">
      <div id="grid" class="grid" role="grid" aria-label="주기율표 그리드"></div>
    </main>

    <div id="tooltip" role="tooltip" aria-hidden="true"></div>

    <dialog id="elementDialog" aria-label="원소 상세" aria-modal="true">
      <form method="dialog">
        <button class="dialog-close" aria-label="닫기">×</button>
      </form>
      <div class="dialog-body"></div>
      <div class="dialog-actions">
        <a id="wikiLink" class="chip" target="_blank" rel="noopener noreferrer">🔗 자세히 보기 (Wikipedia)</a>
      </div>
    </dialog>

    <footer class="footer">
      <div class="footer-meta">
        <div>사업자 등록번호 | 735-23-01161</div>
        <div>통신판매업신고 | 2025-성남분당A-0704</div>
        <div>Copyright 2025 ©Oswarld. All rights reserved.</div>
      </div>
      <div class="footer-social" style="margin-top: 8px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
        <a class="chip" href="https://t.me/oswarld_oz" target="_blank" rel="noopener noreferrer">📨 Telegram</a>
        <a class="chip" href="https://www.linkedin.com/in/oswarld" target="_blank" rel="noopener noreferrer">💼 LinkedIn</a>
        <a class="chip" href="https://www.instagram.com/oswarld.the.lucky.rabbit" target="_blank" rel="noopener noreferrer">📷 Instagram</a>
      </div>
    </footer>

    <script defer src="./assets/app.js"></script>
  </body>
</html>
